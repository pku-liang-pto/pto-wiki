[workspace]
name = "pto-wiki"
version = "0.1.0"
description = "Reusable technical wiki template for a configured repository target set."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tasks]
install = "npm ci"
docs-dev = "npm run docs:dev"
docs-build = "npm run docs:build"
docs-build-pages = "npm run docs:build:pages"
docs-preview = "npm run docs:preview"
agents-check = "npm run agents:check"
wiki-links = "npm run wiki:links"
check = "npm run check"

[dependencies]
nodejs = ">=20,<23"
